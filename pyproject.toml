[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatiotemporal-atlas"
version = "0.1.0"
description = "Spatiotemporal Atlas Building and Inference Framework for C. elegans Development"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Miles" }
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "scikit-learn>=1.1.0",
    "joblib>=1.1.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "networkx>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
